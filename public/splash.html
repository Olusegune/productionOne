<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production One</title>
<style>
@font-face{font-family:"Geist";src:url("/fonts/geist-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--accent:#8ea8ff;--ink:#f3f6fc;--soft:#b9c3d6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10;color:var(--ink);font-family:"Geist","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{position:relative;user-select:none;-webkit-user-select:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:cinema-in 1.1s cubic-bezier(.2,.7,.2,1) both,slow-drift 20s ease-in-out 1.1s infinite alternate}
body:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,8,14,.94) 0%,rgba(6,8,14,.66) 40%,rgba(6,8,14,.10) 76%),linear-gradient(0deg,rgba(6,8,14,.6),transparent 40%,rgba(6,8,14,.25))}
.top{position:absolute;z-index:3;top:18px;right:18px;display:flex;gap:8px;align-items:center}
.top button{font:inherit;color:var(--ink);cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(10,13,22,.55);backdrop-filter:blur(8px);border-radius:10px;transition:background .15s,border-color .15s}
.top button:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.top button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.help{height:34px;padding:0 14px;font-size:13px;font-weight:550;letter-spacing:-.005em}
.close{width:34px;height:34px;display:grid;place-items:center;font-size:0}
.close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.brand{position:absolute;z-index:2;left:7%;top:50%;transform:translateY(-50%);width:min(440px,80%);animation:brand-in .9s .2s cubic-bezier(.2,.7,.2,1) both}
.mark{width:60px;height:60px;border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.14)}
.mark img{width:100%;height:100%;display:block}
h1{margin:22px 0 8px;font-size:clamp(36px,5vw,54px);font-weight:620;line-height:1;letter-spacing:-.04em}
h1 span{color:var(--accent)}
.tag{margin:0;color:var(--soft);font-size:16px;font-weight:450;letter-spacing:-.006em}
.bar{margin:30px 0 12px;width:210px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.5s ease-in-out infinite}
.status{color:#8f9bb2;font-size:12.5px;font-weight:500;letter-spacing:.01em}
.corner{position:absolute;z-index:2;left:7%;bottom:6%;color:rgba(228,234,246,.62);font-size:12px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.corner b{color:var(--ink);font-weight:600}
.hint{position:absolute;z-index:2;right:4.5%;bottom:6%;color:rgba(228,234,246,.5);font-size:12px}
.hint kbd{font:inherit;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 6px;margin-right:4px}
@keyframes cinema-in{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1.01)}}
@keyframes slow-drift{from{transform:scale(1.01)}to{transform:scale(1.035) translate3d(-.6%,.2%,0)}}
@keyframes brand-in{from{opacity:0;transform:translateY(calc(-50% + 16px))}to{opacity:1;transform:translateY(-50%)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){.bg,.brand,.bar i{animation:none}.bar i{width:100%;background:var(--accent);opacity:.5}}
</style>
</head>
<body>
<img class="bg" src="/splash.jpg" alt="">
<div class="top">
  <button class="help" id="help" type="button">Help</button>
  <button class="close" id="close" type="button" aria-label="Skip the intro"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
</div>
<div class="brand">
  <div class="mark"><img src="/app-icon.png" alt=""></div>
  <h1>Production <span>One</span></h1>
  <p class="tag">Your AI production department</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="status" role="status">Getting your studio ready…</div>
</div>
<div class="corner">Version <b>0.65.1</b></div>
<div class="hint"><kbd>Esc</kbd>skip</div>
<script>
(function () {
  var call = function (name) {
    try { var i = window.__TAURI_INTERNALS__; if (i && i.invoke) return i.invoke(name); } catch (e) {}
  };
  document.getElementById('close').addEventListener('click', function () { call('splash_dismiss'); });
  document.getElementById('help').addEventListener('click', function () { call('splash_help'); });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') call('splash_dismiss'); if (e.key === 'F1') { e.preventDefault(); call('splash_help'); } });
})();
</script>
</body>
</html>
