<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production One</title>
<style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;background:#070b12;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;color:#f7f3ea}body{position:relative}body:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,16,.92) 0%,rgba(4,8,16,.55) 38%,rgba(4,8,16,.08) 72%),linear-gradient(0deg,rgba(4,8,16,.55),transparent 42%,rgba(4,8,16,.18));pointer-events:none}img{width:100%;height:100%;object-fit:cover;display:block;animation:cinema-in 1.2s cubic-bezier(.2,.7,.2,1) both,slow-drift 18s ease-in-out 1.2s infinite alternate}@keyframes cinema-in{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1.01)}}@keyframes slow-drift{from{transform:scale(1.01) translate3d(0,0,0)}to{transform:scale(1.035) translate3d(-.6%,.2%,0)}}
