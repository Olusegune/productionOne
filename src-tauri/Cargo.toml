[package]
name = "production-guy"
version = "0.1.0"
description = "Your AI Production Department"
authors = ["Production Guy"]
edition = "2021"

[lib]
name = "production_guy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
